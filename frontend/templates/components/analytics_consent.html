{% if posthog_api_key %}
    <aside data-analytics-consent
           hidden
           class="fixed inset-x-4 bottom-4 z-50 mx-auto max-w-2xl rounded-lg border border-gray-200 bg-white p-4 shadow-xl dark:border-gray-700 dark:bg-gray-900"
           aria-label="Analytics preferences">
        <p class="text-sm text-gray-700 dark:text-gray-200">
            May we use privacy-conscious analytics to understand which campaigns and product flows work?
            We do not collect form contents or private page URLs.
        </p>
        <div class="mt-3 flex gap-2">
            <button type="button"
                    data-analytics-consent-accept
                    class="rounded-md bg-green-600 px-3 py-2 text-sm font-semibold text-white">Allow analytics</button>
            <button type="button"
                    data-analytics-consent-decline
                    class="rounded-md border border-gray-300 px-3 py-2 text-sm font-semibold dark:border-gray-600">Decline</button>
        </div>
    </aside>
{% endif %}
