[pytest]
DJANGO_SETTINGS_MODULE = citeguild.test_settings
python_files = tests.py test_*.py *_tests.py
addopts = --strict-markers --durations=20
markers =
    acceptance: real-service MVP acceptance tests run only in the dedicated CI lane
    slow: tests that are intentionally excluded from fast local runs
filterwarnings = ignore::DeprecationWarning:pkg_resources
