# docker-compose -f docker-compose-prod.yml -p "citeguild" up --detach --remove-orphans || true

services:
  db:
    image: rasulkireev/custom-postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  redis:
    image: redis:8.6.3-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    env_file:
      - .env

  qdrant:
    image: qdrant/qdrant:v1.18.3
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__TELEMETRY_DISABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: "${APP_IMAGE:?Set APP_IMAGE to an immutable git-SHA image tag}"
    working_dir: /app
    ports:
      - "8000:80"
    environment:
      APP_PROCESS_TYPE: server
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/api/healthcheck', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    env_file:
      - .env

  workers:
    image: "${APP_IMAGE:?Set APP_IMAGE to an immutable git-SHA image tag}"
    working_dir: /app
    environment:
      APP_PROCESS_TYPE: worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
