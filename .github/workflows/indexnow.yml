name: IndexNow public URL changes
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy Prod]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: citeguild-indexnow
  cancel-in-progress: false
jobs:
  notify:
    if: >-
      github.repository == 'LVTD-LLC/citeguild' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache/restore@v4
        with:
          path: indexnow-state.json
          key: indexnow-citeguild-com-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-citeguild-com-v1-
      - name: Notify IndexNow after verifying the live revision
        env:
          EXPECTED_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          flags=()
          if [ "$EVENT_NAME" = workflow_run ]; then flags+=(--force); fi
          python citeguild/indexnow.py --site-url https://citeguild.com --state indexnow-state.json --expected-revision "$EXPECTED_REVISION" "${flags[@]}"
      - uses: actions/cache/save@v4
        with:
          path: indexnow-state.json
          key: indexnow-citeguild-com-v1-${{ github.run_id }}-${{ github.run_attempt }}
