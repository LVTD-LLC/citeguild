name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ENVIRONMENT: test
  DJANGO_READ_DOT_ENV: "0"
  DEBUG: "0"
  SECRET_KEY: test-secret-key
  SITE_URL: "https://testserver"
  ALLOWED_HOSTS: "localhost,127.0.0.1"

  POSTGRES_DB: citeguild
  POSTGRES_USER: citeguild
  POSTGRES_PASSWORD: citeguild
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: 5432

  MAILGUN_API_KEY: ""
  AWS_S3_ENDPOINT_URL: ""

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python (uv-managed)
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --locked

      - name: Python quality
        run: make python-quality

      - name: Type check
        run: make type-check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Frontend check
        run: make frontend-check

  tests:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: rasulkireev/custom-postgres:18
        env:
          POSTGRES_DB: citeguild
          POSTGRES_USER: citeguild
          POSTGRES_PASSWORD: citeguild
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citeguild -d citeguild"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python (uv-managed)
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --locked

      - name: Migrations check
        run: make migrations-check

      - name: Django checks
        run: make django-check

      - name: Pytest and high-risk coverage
        run: make coverage-high-risk COVERAGE_FAIL_UNDER=0 -- -q
