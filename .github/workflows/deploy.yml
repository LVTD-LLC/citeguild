name: Deploy Prod

on:
  push:
    branches:
      - main

env:
  CAPROVER_APP_NAME: citeguild
  PRODUCTION_HEALTHCHECK_URL: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          WORKERS_APP_TOKEN: ${{ secrets.WORKERS_APP_TOKEN }}
          WORKERS_APP_PROCESS_TYPE: ${{ vars.WORKERS_APP_PROCESS_TYPE }}
        run: |
          set -euo pipefail
          test -n "$CAPROVER_SERVER"
          test -n "$APP_TOKEN"
          test -n "$WORKERS_APP_TOKEN"
          test -n "$PRODUCTION_HEALTHCHECK_URL"
          if [ "$WORKERS_APP_PROCESS_TYPE" != "worker" ]; then
            echo "::error::Set WORKERS_APP_PROCESS_TYPE=worker and APP_PROCESS_TYPE=worker on the workers app."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image name
        id: image
        shell: bash
        run: echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: deployment/Dockerfile
          build-args: CITEGUILD_RELEASE=${{ github.sha }}
          tags: ${{ steps.image.outputs.image_name }}:${{ github.sha }}

      # CapRover CLI 2.4.0 has conflicting -t flags and cannot start.
      - name: Install CapRover CLI
        run: npm install --global caprover@2.3.1

      - name: Deploy server to CapRover
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          CAPROVER_APP_TOKEN: ${{ secrets.APP_TOKEN }}
          IMAGE_NAME: ${{ steps.image.outputs.image_name }}
        run: >-
          caprover deploy
          --caproverUrl "$CAPROVER_SERVER"
          --appToken "$CAPROVER_APP_TOKEN"
          --appName "$CAPROVER_APP_NAME"
          --imageName "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Verify production health
        shell: bash
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            if curl --fail --silent --show-error --max-time 10 \
              "$PRODUCTION_HEALTHCHECK_URL" | python -c '
          import json
          import os
          import sys

          payload = json.load(sys.stdin)
          checks = payload.get("checks", {})
          expected = ("database", "redis", "qdrant")
          if payload.get("release") != os.environ["EXPECTED_RELEASE"]:
              raise SystemExit(1)
          if payload.get("healthy") is not True or not all(checks.get(name) is True for name in expected):
              raise SystemExit(1)
          '; then
              exit 0
            fi
            echo "Production is not ready yet (attempt $attempt/24)."
            sleep 5
          done
          echo "::error::Production health did not become ready within two minutes."
          exit 1

      - name: Deploy workers to CapRover
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          CAPROVER_APP_TOKEN: ${{ secrets.WORKERS_APP_TOKEN }}
          IMAGE_NAME: ${{ steps.image.outputs.image_name }}
        run: >-
          caprover deploy
          --caproverUrl "$CAPROVER_SERVER"
          --appToken "$CAPROVER_APP_TOKEN"
          --appName "${CAPROVER_APP_NAME}-workers"
          --imageName "${IMAGE_NAME}:${GITHUB_SHA}"
